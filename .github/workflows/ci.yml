name: Portfolio CI
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  code-quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
  unit-tests:
    name: Unit tests and 70% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:coverage
  integration-tests:
    name: Production-build integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration
  overall-check:
    name: Overall release check
    if: always()
    needs: [code-quality, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI role to pass
        run: test '${{ needs.code-quality.result }}' = success && test '${{ needs.unit-tests.result }}' = success && test '${{ needs.integration-tests.result }}' = success
