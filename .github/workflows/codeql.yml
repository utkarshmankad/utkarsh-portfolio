name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "43 4 * * 2"
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v4
